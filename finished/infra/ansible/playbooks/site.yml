- name: Provision and deploy app on private EC2 (docker compose)
  hosts: app
  become: true

  vars_files:
    - group_vars/all/ci.yml

  vars:
    repo_url: "https://github.com/Pavlobuch/full-stack-js-docker-tutorial.git"
    repo_dest: "/opt/apps/fullstack"
    compose_dir: "/opt/apps/fullstack/finished"
    compose_file: "/opt/apps/fullstack/finished/docker-compose.yml"
    docker_cli_plugins_dir_local: "/usr/local/lib/docker/cli-plugins"
    docker_cli_plugins_dir_exec: "/usr/libexec/docker/cli-plugins"
    docker_buildx_local: "/usr/local/lib/docker/cli-plugins/docker-buildx"
    docker_buildx_exec: "/usr/libexec/docker/cli-plugins/docker-buildx"

    # .env content for compose
    env_file_path: "/opt/apps/fullstack/finished/.env"
    env_file_content: |
      MYSQL_DATABASE=blog
      MYSQL_USER=bloguser
      MYSQL_PASSWORD=blogpass
      MYSQL_ROOT_PASSWORD=rootpass
      MYSQL_HOST=db
      API_PORT=5050
      CLIENT_PORT=3000

    # Docker CLI plugins path
    docker_cli_plugins_dir: "/usr/local/lib/docker/cli-plugins"
    docker_compose_plugin_path: "/usr/local/lib/docker/cli-plugins/docker-compose"
    docker_buildx_plugin_path: "/usr/local/lib/docker/cli-plugins/docker-buildx"

  tasks:
    - name: Update packages
      ansible.builtin.command: dnf -y update
      changed_when: false

    - name: Install base packages (git + ca-certs)
      ansible.builtin.package:
        name:
          - git
          - ca-certificates
        state: present

    - name: Install Docker (if not present)
      ansible.builtin.package:
        name: docker
        state: present

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Ensure docker group exists
      ansible.builtin.group:
        name: docker
        state: present

    - name: Ensure SSM Agent installed
      ansible.builtin.package:
        name: amazon-ssm-agent
        state: present

    - name: Enable and start SSM Agent
      ansible.builtin.service:
        name: amazon-ssm-agent
        state: started
        enabled: true

    - name: Install/verify K3s
      ansible.builtin.import_role:
        name: k3s

    - name: CI bootstrap (deploy user + authorized_keys)
      ansible.builtin.import_role:
        name: ci_bootstrap

    - name: Add ec2-user to docker group
      ansible.builtin.user:
        name: ec2-user
        groups: docker
        append: true

    - name: Ensure app base directory exists
      ansible.builtin.file:
        path: /opt/apps
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0755"

    - name: Ensure repo directory ownership is ec2-user
      ansible.builtin.file:
        path: "{{ repo_dest }}"
        state: directory
        owner: ec2-user
        group: ec2-user
        recurse: true

    - name: Mark repo path as safe for git (avoid dubious ownership)
      ansible.builtin.command: git config --global --add safe.directory "{{ repo_dest }}"
      become: false

    - name: Clone application repository (as ec2-user)
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_dest }}"
        version: main
        force: true
      become: false

    - name: Install nano editor
      become: true
      ansible.builtin.dnf:
        name: nano
        state: present


    - name: Install wget
      ansible.builtin.package:
        name: wget
        state: present

    # ---- Build images on EC2 (Docker) ----
    - name: Build finished-api image
      ansible.builtin.command: docker build -t finished-api:latest ./api-server
      args:
        chdir: "{{ repo_dest }}/finished"
      register: build_api
      changed_when: false

    - name: Build finished-ui image
      ansible.builtin.command: docker build -t finished-ui:latest ./blog-ui
      args:
        chdir: "{{ repo_dest }}/finished"
      register: build_ui
      changed_when: false

    - name: Build finished-nginx image
      ansible.builtin.command: docker build -t finished-nginx:latest ./nginx
      args:
        chdir: "{{ repo_dest }}/finished"
      register: build_nginx
      changed_when: false

    # ---- Save -> Import into k3s containerd ----
    - name: Save finished-api image tar
      ansible.builtin.command: docker save finished-api:latest -o /var/tmp/finished-api.tar
      changed_when: false

    - name: Import finished-api into k3s containerd
      ansible.builtin.command: k3s ctr images import /var/tmp/finished-api.tar
      changed_when: false

    - name: Save finished-ui image tar
      ansible.builtin.command: docker save finished-ui:latest -o /var/tmp/finished-ui.tar
      changed_when: false

    - name: Import finished-ui into k3s containerd
      ansible.builtin.command: k3s ctr images import /var/tmp/finished-ui.tar
      changed_when: false

    - name: Save finished-nginx image tar
      ansible.builtin.command: docker save finished-nginx:latest -o /var/tmp/finished-nginx.tar
      changed_when: false

    - name: Import finished-nginx into k3s containerd
      ansible.builtin.command: k3s ctr images import /var/tmp/finished-nginx.tar
      changed_when: false

    # ---- Apply k8s manifests (make apply.sh CWD-independent!) ----
    - name: Run k8s apply
      ansible.builtin.command: ./k8s/apply.sh
      args:
        chdir: "{{ repo_dest }}"
      register: k8s_apply
      changed_when: false

    # ---- Force restart because tag is :latest (otherwise pods may not pick new digest) ----
    - name: Rollout restart deployments (latest tag)
      ansible.builtin.command: kubectl -n app rollout restart deploy/nginx deploy/api deploy/ui
      changed_when: false

    # ---- Wait for rollouts ----
    - name: Wait for nginx rollout
      ansible.builtin.command: kubectl -n app rollout status deploy/nginx --timeout=180s
      changed_when: false

    - name: Wait for api rollout
      ansible.builtin.command: kubectl -n app rollout status deploy/api --timeout=180s
      changed_when: false

    - name: Wait for ui rollout
      ansible.builtin.command: kubectl -n app rollout status deploy/ui --timeout=180s
      changed_when: false

    # ---- Show running containers + k8s statuses ----
    - name: Show Docker containers (build-time runtime)
      ansible.builtin.command: docker ps --format "table {{'{{'}}.Names{{'}}'}}\t{{'{{'}}.Image{{'}}'}}\t{{'{{'}}.Status{{'}}'}}\t{{'{{'}}.Ports{{'}}'}}"
      register: docker_ps
      changed_when: false

    - name: Print docker ps
      ansible.builtin.debug:
        var: docker_ps.stdout_lines

    - name: Show k8s pods/services
      ansible.builtin.command: kubectl -n app get pods,svc -o wide
      register: k8s_status
      changed_when: false

    - name: Print k8s status
      ansible.builtin.debug:
        var: k8s_status.stdout_lines


