# apiVersion: v1
# kind: Service
# metadata:
#   name: nginx
#   namespace: app
# spec:
#   type: ClusterIP
#   selector:
#     app: nginx
#   ports:
#     - name: http
#       port: 80
#       targetPort: 80
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: app
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
